<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
</head>
<body>
<button id="target" style="width: 100px; height: 100px"></button>
<script>
test(test => {
    internals.settings.setTouchEventEmulationEnabled(true);
    test.add_cleanup(() => internals.settings.setTouchEventEmulationEnabled(false));

    const target = document.getElementById("target");
    const pointerdownEvents = [];
    const contextmenuEvents = [];
    target.addEventListener("pointerdown", event => pointerdownEvents.push(event));
    target.addEventListener("contextmenu", event => {
        contextmenuEvents.push(event);
        event.preventDefault();
    });

    // With touch emulation, the secondary button press is also a touch, still pressed when the context menu is
    // asked for, as in a long press. The second press checks that a later touch gets its event too.
    eventSender.mouseMoveTo(50, 50);
    for (let press = 0; press < 2; ++press) {
        eventSender.mouseDown(2);
        eventSender.mouseUp(2);
        eventSender.leapForward(1000);
    }

    assert_equals(pointerdownEvents.length, 2, "pointerdown events");
    assert_equals(contextmenuEvents.length, 2, "contextmenu events");
    for (let press = 0; press < 2; ++press) {
        const contextmenu = contextmenuEvents[press];
        assert_equals(pointerdownEvents[press].pointerType, "touch");
        assert_true(contextmenu instanceof PointerEvent);
        assert_equals(contextmenu.pointerType, "touch");
        assert_equals(contextmenu.pointerId, pointerdownEvents[press].pointerId);
        assert_true(contextmenu.isPrimary);
        assert_equals(contextmenu.button, 2);
    }
}, "The contextmenu event of a long press that comes while the finger is down belongs to its touch.");
</script>
</body>
</html>
